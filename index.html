<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <meta name="theme-color" content="#ffffff" />
    <!-- Anti-kedip tema: jalan sebelum CSS melukis, jadi tidak ada kilatan
         terang saat user memilih gelap. Sengaja tanpa dependensi. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('pralaunch-theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
          var dark =
            t === 'dark' ||
            (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#191919');
          }
        } catch (e) {}
      })();
    </script>

    <meta name="description" content="Task tracker pra-launch toko pet supplies" />
    <title>Pra-Launch</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <!-- iOS mengabaikan manifest untuk ikon home screen; tanpa baris ini ia
         memakai screenshot halaman sebagai ikon. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pra-Launch" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
